<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Important Question</title>
  <style>
    body{
      margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0f0f10; color:#fff;
    }
    .card{
      width:min(520px, 92vw);
      padding:28px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align:center;
    }
    h1{ margin:0 0 14px; font-size: 30px; }
    p{ margin:0 0 20px; opacity:.85; }
    .btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    button{
      border:0; border-radius:12px; padding:12px 18px; font-size:16px;
      cursor:pointer; transition: transform .08s ease;
    }
    button:active{ transform: scale(.98); }
    .yes{ background:#ff3d7f; color:white; }
    .no{ background:#2a2a2e; color:white; border:1px solid rgba(255,255,255,.12); position:relative; }
    .tiny{ margin-top:14px; font-size:12px; opacity:.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey… I have a question 😳💘</h1>
    <p>Will you be my Valentine?</p>

    <div class="btns">
      <button class="yes" id="yesBtn">Yes 😌</button>
      <button class="no" id="noBtn">No 🙄</button>
    </div>

    <div class="tiny">C’mon… choose the right answer 🥀😭</div>
  </div>

  <script>
    // TikTok link she gets sent when Yes is clicked
    const memeUrl = "https://vt.tiktok.com/ZSabkGfRb/";

    document.getElementById("yesBtn").addEventListener("click", () => {
      window.location.href = memeUrl;
    });

    // Make the "No" button run away
    const noBtn = document.getElementById("noBtn");
    const moveNo = () => {
      const pad = 20;
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - pad*2) + pad;
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - pad*2) + pad;
      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    };

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNo(); }, {passive:false});
  </script>
</body>
</html>
